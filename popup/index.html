<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Octagon Room</title>
<style>
@font-face{font-family:"OC Serif";src:url("https://cdn.jsdelivr.net/npm/@fontsource/tinos@5.3.0/files/tinos-latin-400-normal.woff2") format("woff2");font-weight:400;font-display:block}
@font-face{font-family:"OC Sans";src:url("https://cdn.jsdelivr.net/npm/@fontsource/inter@5.3.0/files/inter-latin-300-normal.woff2") format("woff2");font-weight:300;font-display:block}
@font-face{font-family:"OC Sans";src:url("https://cdn.jsdelivr.net/npm/@fontsource/inter@5.3.0/files/inter-latin-400-normal.woff2") format("woff2");font-weight:400;font-display:block}
:root{--ink:#e9ecf2;--gold:#d3d7dd;--line:rgba(214,218,224,.5)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#020504;color:var(--ink);overflow:hidden;font-family:"OC Sans","Helvetica Neue",Arial,sans-serif;font-weight:300;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.btn{font-family:inherit;font-size:12px;font-weight:400;letter-spacing:.24em;text-transform:uppercase;color:var(--ink);background:rgba(10,30,28,.45);border:1px solid var(--line);padding:16px 30px;min-width:180px;cursor:pointer;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:border-color .3s,background .3s,opacity .4s}
.btn:hover{border-color:#e9ecf2;background:rgba(30,80,72,.5)}
#intro{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 45%,#0f2b28 0%,#030807 75%);transition:opacity 1.6s}
#intro.gone{opacity:0;pointer-events:none}
#intro img{width:170px;margin-bottom:58px;opacity:.95}
#intro .s{margin-top:18px;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:rgba(211,215,221,.55);min-height:12px}
#ui{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:0 28px calc(26px + env(safe-area-inset-bottom));pointer-events:none;opacity:0;transition:opacity 1.2s}
#ui.on{opacity:1}
#ui>*{pointer-events:auto}
#pips{display:flex;gap:7px;align-items:center}
.pip{width:7px;height:7px;clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);background:rgba(255,255,255,.2);transition:background .5s,transform .5s}
.pip.on{background:#d3d7dd}
.pip.now{transform:scale(1.5)}
#logoTop{position:fixed;top:calc(22px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);height:16px;z-index:10;opacity:0;transition:opacity 1.2s}
#logoTop.on{opacity:.85}
#next.wait{opacity:.45}
canvas{touch-action:none}
#next.touch{border-color:#16a37f;background:linear-gradient(90deg,rgba(22,163,127,.85) calc(var(--p,0)*100%),rgba(22,163,127,.3) 0);animation:tp 1.6s ease-in-out infinite}
@keyframes tp{50%{box-shadow:0 0 0 10px rgba(22,163,127,0)}0%,100%{box-shadow:0 0 0 0 rgba(22,163,127,.55)}}
#mine{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);z-index:11;display:flex;flex-direction:column;gap:10px;align-items:center;opacity:0;pointer-events:none;transition:opacity .6s,transform .6s}
#mine.on{opacity:1;pointer-events:auto;transform:translateX(-50%)}
#mine .row{display:flex;gap:8px;align-items:center}
#mine .lab{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:rgba(233,236,242,.6);width:56px;text-align:right;margin-right:6px}
#mine .chip{font-family:inherit;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);background:rgba(10,30,28,.5);border:1px solid var(--line);padding:10px 14px;cursor:pointer;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#mine .chip.sel{border-color:#16a37f;background:rgba(22,163,127,.4)}
#head{position:fixed;left:0;right:0;bottom:calc(92px + env(safe-area-inset-bottom));z-index:10;text-align:center;pointer-events:none;font-family:"OC Serif","Times New Roman",serif;font-size:34px;color:#eef2f2;text-shadow:0 2px 18px rgba(0,0,0,.55);opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s}
#head.on{opacity:1;transform:none}
@media (max-width:600px){#head{font-size:28px;bottom:calc(84px + env(safe-area-inset-bottom))}}
@media (max-width:600px){#ui{padding:0 16px calc(20px + env(safe-area-inset-bottom))}.btn{min-width:140px;padding:14px 20px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<img id="logoTop" alt="AP × Apple">
<div id="intro"><img id="logoIntro" alt="AP × Apple"><button class="btn" id="enter">Enter</button><div class="s" id="status">Sound on</div></div>
<div id="head"></div>
<div id="mine"><div class="row"><span class="lab">Strap</span><button class="chip sel" data-k="strap" data-v="steel">Steel</button><button class="chip" data-k="strap" data-v="rubber">Rubber</button></div>
<div class="row"><span class="lab">Dial</span><button class="chip sel" data-k="dial" data-v="green">AP Green</button><button class="chip" data-k="dial" data-v="midnight">Midnight</button><button class="chip" data-k="dial" data-v="smoke">Smoke</button></div></div>
<div id="ui"><div id="pips"></div><button class="btn" id="next">Next</button></div>

   ================================================================ */

const tickByHour=h=>ticks[h-1];
const spark=(()=>{const[c,x]=canvas(128);const g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'#fff');g.addColorStop(.35,'rgba(255,255,255,.5)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle='#000';x.fillRect(0,0,128,128);x.fillStyle=g;x.fillRect(0,0,128,128);

  else if(t){const L=t.split('|');let fs=104;x.font='400 '+fs+'px '+F;const mw=Math.max(...L.map(l=>x.measureText(l).width));if(mw>1040){fs=Math.floor(fs*1040/mw);x.font='400 '+fs+'px '+F;}

const screenU={uTime:{value:0},uPulse:{value:0},uInvite:{value:0},uRing:{value:-1},uDark:{value:0},uTxt:{value:txtTex},uTxtA:{value:0},uLogo:{value:null},uLogoA:{value:0},uLogoAsp:{value:.3},uG:{value:new THREE.Color(AP_GREEN)},uC1:{value:new THREE.Color('#021a16')},uC2:{value:new THREE.Color('#13705d')},uC3:{value:new THREE.Color('#7ff0d2')}};
const screenVS=`varying vec2 vUv;varying vec3 vW;void main(){vUv=uv;vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`;
const screenFS=`
uniform float uTime,uPulse,uInvite,uRing,uReveal,uMode,uW,uDark,uTxtA,uLogoA,uLogoAsp;uniform vec3 uC1,uC2,uC3,uG;uniform sampler2D uText,uTxt,uLogo;uniform float uHasText;

float rsm(float a,float b,float x){return 1.-smoothstep(a,b,x);}void main(){
  vec2 q=uMode<.5?vec2(vUv.x*uW,vUv.y*${H.toFixed(1)}):vW.xz;
  float cell=.1;vec2 id=floor(q/cell),f=fract(q/cell)-.5,a=abs(f);
  /* reveal: a digital wipe, cell by cell, with a bright leading edge */
  float coord=uMode<.5?vUv.y:length(vW.xz)/${(A/Math.cos(T/8)).toFixed(3)};
  float jit=h21(id)*.08;float edge=uReveal*1.15-.075;float m=step(coord+jit,edge);
  float lead=rsm(0.,.05,abs(coord+jit-edge))*step(.001,uReveal)*step(uReveal,.999);
  float md=step(coord+jit*.5,uDark*1.1-.05);
  if(m<.5&&lead<.01&&md<.5)discard;
  /* Grande Tapisserie: a pyramid in every square, lit by a slowly turning light */
  vec2 L=normalize(vec2(cos(uTime*.18),sin(uTime*.18)));float s;
  if(max(a.x,a.y)<.2)s=.62;else if(a.x>a.y)s=.5+.42*sign(f.x)*L.x;else s=.5+.42*sign(f.y)*L.y;

  float aa=clamp(fwidth(q.x/cell)+fwidth(q.y/cell),0.,2.);float pat=1.-smoothstep(.12,.42,aa);

  float d=length(vW-vec3(0.,0.,0.));

const N=STEPS.length;

/* ---------- per-frame world update ---------- */

  /* camera: a person, standing or walking, eyes at 1.66 m */
  if(!camS.rail){const k=1-Math.exp(-dt*camS.k);camS.pos.lerp(camS.posT,k);camS.look.lerp(camS.lookT,1-Math.exp(-dt*camS.k*1.3));}

  camera.lookAt(camS.look.x+dx,camS.look.y+dy,camS.look.z);
  /* the room */
  roomLights.forEach(l=>l.intensity=lerp(0,4,St.room)*(1-.75*St.wall)*(1-.55*St.dark*(1-St.wall)));
  coveMat.color.setRGB(1.3,1.45,1.45).multiplyScalar((.15+.85*St.room)*(1-.5*St.wall)*(camS.pos.z>A+TUN?.3:1));coveLow.color.setRGB(.55,.7,.68).multiplyScalar(.15+.85*St.room);

  {const r=St.revealY;const on=St.op>.01&&r>0&&r<3.3&&(si===4||si===N-1);scanRing.visible=on;scanRing.position.y=Math.max(.01,r);scanRing.material.opacity=on?.9:0;}

  {const p=St.sparkP||0,on=p>0&&p<1;spark.visible=on;if(on){const T0=ticks[St.sparkK-1].g.position,e=ease(p);spark.position.set(T0.x*(1-e),.03,T0.z*(1-e));spark.material.opacity=Math.sin(p*Math.PI);spark.scale.setScalar(1+.6*Math.sin(p*Math.PI));}}

/* fast-forward without sound, used by Next while a moment is still playing, and by Back */
function simulate(sec){SIMS.on=true;const dt=1/30;for(let t=0;t<sec;t+=dt){runStep(dt);world(dt);}SIMS.on=false;}
function goTo(n){SIMS.on=true;enter(0);for(let k=0;k<=n;k++){if(k>0)enter(k);touched=true;for(let t=0;t<=STEPS[k].dur+.01;t+=1/30){runStep(1/30);world(1/30);}}for(let t=0;t<3;t+=1/30)world(1/30);SIMS.on=false;}

/* ---------- UI ---------- */
const pips=$('pips');for(let i=0;i<N;i++){const d=document.createElement('div');d.className='pip';pips.appendChild(d);}

let headShown=null;
function head(){const h=HEADS[si]||'';if(h===headShown)return;headShown=h;const el=$('head');el.classList.remove('on');setTimeout(()=>{el.textContent=h;if(h)el.classList.add('on');},h&&el.textContent?380:0);}
function ui(){[...pips.children].forEach((p,i)=>{p.classList.toggle('on',i<=si);p.classList.toggle('now',i===si);});
  const S=STEPS[si],wt2=S.touch&&!touched;$('next').textContent=si===N-1?'Replay':si===0?'Walk in':wt2?(S.label||'Touch your tick'):'Next';$('next').classList.toggle('touch',!!wt2);$('next').classList.toggle('wait',!wt2&&!done());
  $('mine').classList.toggle('on',si===MINE_STEP);}
function next(force){
  {const S=STEPS[si];if(S.touch&&!touched){if(S.hold&&!force)return;touched=true;St.dragP=0;ui();return;}}
  if(!done()){simulate(STEPS[si].dur-stT+.01);ui();return;}
  if(si===N-1){goTo(0);setAmb(.25);ui();return;}
  enter(si+1);ui();}
$('next').onclick=()=>{initAudio();next();};
addEventListener('keydown',e=>{if(!started)return;if(e.key===' '||e.key==='ArrowRight'||e.key==='Enter'){e.preventDefault();next(true);}else if(e.key==='ArrowLeft'&&si>0){goTo(si-1);ui();}});
let started=false;
document.querySelectorAll('#mine .chip').forEach(b=>b.onclick=()=>{initAudio();MINE[b.dataset.k]=b.dataset.v;document.querySelectorAll('#mine .chip[data-k="'+b.dataset.k+'"]').forEach(o=>o.classList.toggle('sel',o===b));applyMine();chime(b.dataset.k==='dial'?4:1,false,.5);});
let holding=false,drag=null,holdT0=0;
const pullDone=()=>{drag=null;touched=true;St.dragP=0;chime(5,false,.7);ui();};
const startHold=e=>{if(!started)return;const S=STEPS[si];if(!S.touch||touched)return;initAudio();
  if(S.hold){holding=true;holdT0=performance.now();thump(0,.3);}else if(S.drag&&e.currentTarget===renderer.domElement)drag={y:e.clientY};};
renderer.domElement.addEventListener('pointerdown',startHold);$('next').addEventListener('pointerdown',startHold);
addEventListener('pointermove',e=>{if(!drag)return;St.dragP=clamp((drag.y-e.clientY)/(innerHeight*.28));if(St.dragP>=1)pullDone();});
addEventListener('pointerup',()=>{holding=false;if(drag){if(St.dragP>.55)pullDone();else{drag=null;St.dragP=0;}}});
addEventListener('pointercancel',()=>{holding=false;drag=null;St.dragP=0;});
$('enter').onclick=()=>{initAudio();setAmb(.25);started=true;$('intro').classList.add('gone');$('ui').classList.add('on');$('logoTop').classList.add('on');ui();};

/* ---------- loop ---------- */
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);composer.setSize(w,h);camera.aspect=w/h;camera.fov=w<h?70:52;camera.updateProjectionMatrix();bloom.setSize(w*DPR,h*DPR);grade.uniforms.uRes.value.set(w,h);
  mirror.getRenderTarget().setSize(Math.round(w*DPR*.6),Math.round(h*DPR*.6));}
addEventListener('resize',resize);resize();
enter(0);
let last=performance.now()/1000;
function frame(){const now=performance.now()/1000,dt=Math.min(.05,now-last);last=now;
  St.fade=Math.min(1,St.fade+dt*.5);runStep(dt);world(dt);if(started&&Math.random()<.2)ui();composer.render();}
renderer.setAnimationLoop(P.has('shot')?null:frame);
window.__dbg={goTo:(n,extra=0)=>{goTo(n);if(extra)simulate(extra);St.fade=1;grade.uniforms.uFade.value=1;composer.render();return si;},
  mid:(n,t,idle)=>{goTo(n-1);SIMS.on=true;enter(n);touched=!idle;simulate(t);SIMS.on=false;St.fade=1;grade.uniforms.uFade.value=1;world(0);composer.render();},render:()=>composer.render(),St,renderer,composer,scene,camera,grade,bloom,holoRoot,pivot,holoU,get si(){return si;}};
$('status').textContent='Sound on';
</script>
